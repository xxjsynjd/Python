[package]
name = "sphn"
version = "0.2.1"
edition = "2021"
license = "MIT/Apache-2.0"
description = "pyo3 wrappers to read/write audio files"
repository = "https://github.com/LaurentMazare/sphn"
keywords = ["pyo3", "audio"]
categories = ["FFI"]

[lib]
name = "sphn"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.79"
byteorder = "1.5.0"
kaudio = "0.2.1"
numpy = "0.27.0"
ogg = "0.9.1"
opus = "0.3.0"
pyo3 = "0.27.0"
rand = "0.8.5"
rayon = "1.8.1"
rubato = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.113"
symphonia = { version = "0.5.4", features = ["all"] }

[profile.release]
debug = true

[profile.release-no-debug]
inherits = "release"
debug = false

[patch.crates-io]
audiopus_sys = { path = "/data/data/com.termux/files/home/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/audiopus_sys-0.2.2" }
